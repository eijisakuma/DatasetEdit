<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataSet XML エディター - Webスプレッドシート編集ツール</title>
  
  <!-- Tabulator スプレッドシートライブラリ (CSS & JS) -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.5.4/dist/css/tabulator_modern.min.css">
  <script src="https://unpkg.com/tabulator-tables@5.5.4/dist/js/tabulator.min.js"></script>

  <!-- アプリケーション独自スタイルシート -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =======================================================================
       1. ヘッダーペイン (Header Pane)
       タイトルおよび主要アクション（保存、サンプル読込）
       ======================================================================= -->
  <header class="app-header">
    <div class="app-title-group">
      <h1 class="app-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        DataSet XML エディター
      </h1>
      <span class="app-subtitle">C# DataSet.WriteXml 対応スプレッドシート</span>
    </div>

    <div class="header-actions">
      <!-- サンプルデータ読み込みボタン -->
      <button id="btn-load-sample" class="btn btn-outline" title="動作確認用のサンプルDataSet XMLを読み込みます">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        サンプル読込
      </button>

      <!-- XML保存（ダウンロード）ボタン -->
      <button id="btn-save-xml" class="btn btn-success" disabled title="編集したデータをC#互換のXMLファイルとして保存します">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        XML保存（ダウンロード）
      </button>
    </div>
  </header>

  <!-- =======================================================================
       2. メインコンテナ（左ペイン ＋ メインコンテンツ）
       ======================================================================= -->
  <div class="app-container">

    <!-- -------------------------------------------------------------------
         左ペイン: ファイル指定 & DataSet テーブル一覧
         ------------------------------------------------------------------- -->
    <aside class="sidebar">
      
      <!-- ファイル読み込み部 -->
      <div class="file-upload-section">
        <input type="file" id="file-input" accept=".xml" style="display: none;">
        <div id="drop-zone" class="drop-zone" title="クリックまたはXMLファイルをここにドラッグ＆ドロップしてください">
          <div class="drop-zone-icon">📁</div>
          <div class="drop-zone-text"><strong>XMLファイルを選択</strong></div>
          <div class="drop-zone-subtext">またはファイルをここにドロップ</div>
        </div>

        <!-- 読み込み中ファイルの情報バッジ -->
        <div id="file-info-badge" class="file-info-badge" style="display: none;"></div>
      </div>

      <!-- テーブル一覧リスト -->
      <div class="tables-section">
        <div class="section-title">
          <span>テーブル一覧</span>
          <span style="font-weight: normal; font-size: 0.75rem;">(クリックで切替)</span>
        </div>
        <ul id="table-list" class="table-list">
          <li class="empty-state">
            XMLファイルを読み込むと<br>ここにテーブルが表示されます
          </li>
        </ul>
      </div>

    </aside>

    <!-- -------------------------------------------------------------------
         メインコンテンツ: スプレッドシート表示・編集
         ------------------------------------------------------------------- -->
    <main class="main-content">

      <!-- メインペインヘッダー & ツールバー -->
      <div class="content-header">
        <div class="current-table-info">
          <span class="current-table-title" id="current-table-name">未選択</span>
          <span class="current-table-stats" id="current-table-stats">-</span>
        </div>

        <!-- テーブル編集ツールバー -->
        <div class="toolbar-actions" id="main-toolbar" style="display: none;">
          <button id="btn-add-row" class="btn btn-secondary" title="末尾に新しい空行を追加します">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            行を追加
          </button>

          <button id="btn-delete-row" class="btn btn-danger" title="左端のチェックボックスで選択した行を削除します">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            選択行を削除
          </button>

          <button id="btn-undo" class="btn btn-secondary" title="最後の操作を取り消します">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            元に戻す
          </button>

          <button id="btn-redo" class="btn btn-secondary" title="取り消した操作をやり直します">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            やり直す
          </button>

          <button id="btn-export-csv" class="btn btn-secondary" title="現在表示中のテーブルをCSV形式で保存します">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            CSV出力
          </button>
        </div>
      </div>

      <!-- スプレッドシート表示領域 -->
      <div class="grid-container">
        <div id="table-grid"></div>

        <!-- テーブル未選択時の案内メッセージ -->
        <div id="no-table-placeholder" class="no-table-selected">
          <div class="no-table-icon">📊</div>
          <h3>XMLファイルが指定されていません</h3>
          <p>左ペインからXMLファイルを選択するか、「サンプル読込」をクリックしてください。</p>
        </div>
      </div>

    </main>

  </div>

  <!-- =======================================================================
       3. フッター / ステータスバー
       ======================================================================= -->
  <footer class="status-bar">
    <div class="status-message">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-message">準備完了</span>
    </div>
    <div style="font-size: 0.72rem; color: #94a3b8;">
      ヒント: セルをダブルクリックして編集 / 列ヘッダーをクリックしてソート / 検索ボックスで絞り込み
    </div>
  </footer>

  <!-- アプリケーションスクリプト -->
  <script src="app.js"></script>
</body>
</html>
